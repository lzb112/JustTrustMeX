plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zx.Justmeplush'
    compileSdk 35

    defaultConfig {
        applicationId "com.lzb.Justmeplush"
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName "4.0"
    }

    signingConfigs {
        release {
            storeFile file('CERT.keystore')
            storePassword "123456"
            keyAlias "CERT"
            keyPassword "123456"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug 也用同一套签名，方便直接覆盖安装
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/*.kotlin_module',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1',
            ]
        }
    }
}

dependencies {
    // Xposed 框架 API：只在编译期需要，运行时由框架注入
    compileOnly 'de.robv.android.xposed:api:82'

    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// AppCompat 会同时拉入 kotlin-stdlib 与旧的 kotlin-stdlib-jdk7/jdk8，
// 造成 kotlin.collections.jdk8.* 之类的重复类。Kotlin 1.8 起 jdk7/jdk8 已并入 stdlib，
// 统一强制到同一版本即可消除重复。
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
